# 基线配置：RGB(B) + A + 骨架 + 端点 + 方向场 + 距离场
# 对应方案第 1-2 周（先跑通，再逐步加通道做消融）

data:
  # 清单文件：jsonl 或 csv，每项需要 name / rgb / a / gt 四个字段
  train_manifest: data/train.jsonl
  val_manifest: data/val.jsonl
  root: null                   # 清单中相对路径的基准目录
  num_workers: 4
  gt_dilate: 1                 # GT 训练时膨胀像素数；推理后骨架化回 1px
  hint_dropout: 0.15           # 整张 A 派生通道随机置零的概率
  augment: true
  color_jitter: 0.15

model:
  encoder: resnet34            # resnet18 / resnet34 / resnet50
  channels: [rgb, a, skel, endpoint, dir, dist]
  pretrained: true             # ImageNet 预训练；离线环境设为 false
  out_stride: 2                # 输出分辨率 = 输入/2
  decoder_ch: 128
  dropout: 0.0

train:
  out_dir: runs/base
  epochs: 40
  batch_size: 8
  lr: 3.0e-4
  weight_decay: 1.0e-4
  pct_start: 0.1
  pos_weight: 5.0
  w_bce: 1.0
  w_dice: 1.0
  w_cldice: 1.0
  skel_iter: 10
  clip_grad: 1.0
  amp: true
  seed: 42
  device: cuda
  log_every: 20
  val_every: 1
  limit: 0

eval:
  threshold: 0.5
  apls_samples: 100
